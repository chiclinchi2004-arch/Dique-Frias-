<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Fondo Degradado Primaveral -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f141a" />
      <stop offset="50%" stop-color="#122534" />
      <stop offset="100%" stop-color="#0f141a" />
    </linearGradient>

    <!-- Sombra Glow Celeste Cyan -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="800" height="800" fill="url(#bgGradient)" rx="20" />

  <!-- MARCO Y DECORACIONES -->
  <rect x="30" y="30" width="740" height="740" fill="none" stroke="#00d9ff" stroke-width="2" rx="15" opacity="0.4" />

  <!-- FLORES SUPERIORES (Estilo Neón / Ilustración) -->
  <!-- Flor Izquierda -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="-25" r="18" fill="#ff4b8b" opacity="0.8" />
    <circle cx="25" cy="0" r="18" fill="#ff4b8b" opacity="0.8" />
    <circle cx="0" cy="25" r="18" fill="#ff4b8b" opacity="0.8" />
    <circle cx="-25" cy="0" r="18" fill="#ff4b8b" opacity="0.8" />
    <circle cx="0" cy="0" r="15" fill="#ffb703" />
  </g>

  <!-- Flor Derecha -->
  <g transform="translate(680, 120)">
    <circle cx="0" cy="-25" r="18" fill="#00d9ff" opacity="0.8" />
    <circle cx="25" cy="0" r="18" fill="#00d9ff" opacity="0.8" />
    <circle cx="0" cy="25" r="18" fill="#00d9ff" opacity="0.8" />
    <circle cx="-25" cy="0" r="18" fill="#00d9ff" opacity="0.8" />
    <circle cx="0" cy="0" r="15" fill="#ffb703" />
  </g>

  <!-- CORAZONES FLOTANTES -->
  <!-- Corazón Izquierdo Superior -->
  <path d="M 180,220 A 15,15 0 0,0 150,220 A 15,15 0 0,0 120,220 Q 120,245 150,270 Q 180,245 180,220 Z" fill="#ff4b8b" filter="url(#glow)" />
  <!-- Corazón Derecho Superior -->
  <path d="M 680,220 A 15,15 0 0,0 650,220 A 15,15 0 0,0 620,220 Q 620,245 650,270 Q 680,245 680,220 Z" fill="#00d9ff" filter="url(#glow)" />

  <!-- TEXTOS PRINCIPALES -->
  <!-- Subtítulo / Saludo 1 -->
  <text x="400" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" fill="#ffb703" text-anchor="middle" letter-spacing="3">
    ¡FELIZ DÍA DEL!
  </text>

  <!-- Título Estudiante -->
  <text x="400" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#00d9ff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    ESTUDIANTE
  </text>

  <!-- Separador / Y -->
  <text x="400" y="410" font-family="'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.7">
    — &amp; —
  </text>

  <!-- Título Primavera -->
  <text x="400" y="500" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="60" fill="#ff4b8b" text-anchor="middle" letter-spacing="3" filter="url(#glow)">
    ¡FELIZ PRIMAVERA!
  </text>

  <!-- Subtítulo Deseo -->
  <text x="400" y="570" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#e0e0e0" text-anchor="middle" letter-spacing="1">
    Que sea una etapa llena de flores, energía y nuevos proyectos.
  </text>

  <!-- FLORES Y CORAZONES INFERIORES -->
  <!-- Corazón Central Inferior -->
  <path d="M 415,640 A 12,12 0 0,0 391,640 A 12,12 0 0,0 367,640 Q 367,660 391,680 Q 415,660 415,640 Z" fill="#ffb703" />

  <!-- Flor Inferior Izquierda -->
  <g transform="translate(220, 680)">
    <circle cx="0" cy="-18" r="14" fill="#ffb703" opacity="0.8" />
    <circle cx="18" cy="0" r="14" fill="#ffb703" opacity="0.8" />
    <circle cx="0" cy="18" r="14" fill="#ffb703" opacity="0.8" />
    <circle cx="-18" cy="0" r="14" fill="#ffb703" opacity="0.8" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>

  <!-- Flor Inferior Derecha -->
  <g transform="translate(580, 680)">
    <circle cx="0" cy="-18" r="14" fill="#00d9ff" opacity="0.8" />
    <circle cx="18" cy="0" r="14" fill="#00d9ff" opacity="0.8" />
    <circle cx="0" cy="18" r="14" fill="#00d9ff" opacity="0.8" />
    <circle cx="-18" cy="0" r="14" fill="#00d9ff" opacity="0.8" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>
</svg>
